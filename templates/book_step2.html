{% extends "base.html" %}
{% block title %}Book Appointment{% endblock %}
{% block content %}
<style>
  .book-wrapper {
    max-width: 520px;
    margin: 32px auto;
    background:#ffffff;
    border-radius:14px;
    box-shadow:0 4px 18px rgba(31,125,180,0.08);
    padding:22px 24px 26px;
    font-family:'Segoe UI','Arial',sans-serif;
    color:#234e36;
  }
  .book-title {
    font-size:1.4rem;
    font-weight:600;
    color:#186943;
    margin-bottom:6px;
  }
  .book-subtitle {
    font-size:0.9rem;
    color:#4a6672;
    margin-bottom:14px;
  }
  .form-group { margin-bottom:12px; }
  .form-group label {
    display:block;
    margin-bottom:4px;
    font-size:0.95rem;
  }
  .form-group input,
  .form-group select {
    width:100%;
    padding:8px 10px;
    border-radius:8px;
    border:1px solid #cfe7dd;
    font-size:0.95rem;
  }
  .form-actions { margin-top:16px; text-align:right; }
  .btn {
    padding:8px 14px;
    border-radius:8px;
    border:none;
    font-size:0.92rem;
    cursor:pointer;
  }
  .btn-primary { background:#1f6fb2; color:#fff; }
  .btn-secondary { background:#a0aec0; color:#fff; margin-right:6px; }
</style>

<div class="book-wrapper">
  <div class="book-title">Book Appointment</div>
  <div class="book-subtitle">
    Treatment: <strong>{{ treatment.treat_name }}</strong>
    {% if treatment.department %}
      ({{ treatment.department.dept_name }})
    {% endif %}
  </div>

  <form method="POST"
        action="{{ url_for('book_appointment_step2', treatment_id=treatment.id) }}">
    <div class="form-group">
      <label for="date">Date</label>
      <input type="date" id="date" name="date" value="{{ sel_date or '' }}" required>
    </div>

    <div class="form-group">
      <label for="time">Time (15‑minute slots)</label>
      <select id="time" name="time" required>
        <option value="">Select time</option>
        {% for hour in range(9, 17) %}
          {% for minute in (0, 15, 30, 45) %}
            {% set t = "%02d:%02d"|format(hour, minute) %}
            <option value="{{ t }}" {% if sel_time == t %}selected{% endif %}>
              {{ t }}
            </option>
          {% endfor %}
        {% endfor %}
      </select>
    </div>

    <div class="form-actions">
      <a href="{{ url_for('book_appointment_step1') }}" class="btn btn-secondary">Back</a>
      <button type="submit" class="btn btn-primary">Next</button>
    </div>
  </form>
</div>
{% endblock %}
