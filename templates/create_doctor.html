{% extends "base.html" %}
{% block title %}Create Doctor{% endblock %}
{% block content %}
<style>
    body {
        background: linear-gradient(120deg, #f0fff4 0%, #e9f7fd 100%);
        font-family: 'Segoe UI', 'Arial', sans-serif;
        color: #234e36;
        margin: 0;
        padding: 0;
    }
    .form-wrapper {
        max-width: 520px;
        margin: 40px auto;
    }
    .form-card {
        background: #ffffff;
        border-radius: 18px;
        box-shadow: 0 10px 32px rgba(85, 200, 120, 0.09);
        padding: 24px 26px 28px;
    }
    .form-header {
        background: linear-gradient(90deg, #a4f6c1 60%, #85d7ed 100%);
        border-radius: 14px;
        padding: 14px 18px;
        margin: -10px -10px 18px;
    }
    .form-header h2 {
        margin: 0;
        font-size: 1.4em;
        color: #186943;
    }
    .form-group {
        margin-bottom: 14px;
    }
    .form-group label {
        display: block;
        margin-bottom: 4px;
        font-size: 0.95em;
        color: #365b46;
    }
    .form-group input,
    .form-group select {
        width: 100%;
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid #b6e3d6;
        font-size: 0.96em;
        outline: none;
    }
    .form-actions {
        margin-top: 18px;
        text-align: right;
    }
    .button {
        padding: 8px 16px;
        border: none;
        border-radius: 8px;
        font-size: 0.96em;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.2s;
    }
    .button-primary {
        background: #2ca97b;
        color: #fff;
    }
    .button-secondary {
        background: #a0aec0;
        color: #fff;
        margin-right: 8px;
    }
    .button-primary:hover {
        background: #248864;
    }
    .button-secondary:hover {
        background: #8a96a8;
    }
</style>

<div class="form-wrapper">
    <div class="form-card">
        <div class="form-header">
            <h2>Create Doctor</h2>
        </div>
        <form method="POST" action="{{ url_for('create_doctor') }}">
            <div class="form-group">
                <label for="name">Doctor Name</label>
                <input type="text" id="name" name="username" required>
            </div>

            <div class="form-group">
                <label for="email">Doctor Email</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="password">Doctor Password</label>
                <input type="password" id="password" name="password" required>
            </div>

            <div class="form-group">
                <label for="department">Department</label>
                <select id="department" name="dept_id" required>
                    <option value="">Select Department</option>
                    {% for dept in departments %}
                    <option value="{{ dept.dept_id }}">{{ dept.dept_name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="qualification">Qualification</label>
                <input type="text" id="qualification" name="qualification">
            </div>

            <div class="form-group">
                <label for="experience">Experience (years)</label>
                <input type="number" id="experience" name="experience" min="0">
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" rows="3" style="width:100%; padding:8px 10px; border-radius:8px; border:1px solid #cfe7dd;"></textarea>
            </div>

            <div class="form-actions">
                <a href="{{ url_for('admin_dashboard') }}" class="button button-secondary">Cancel</a>
                <button type="submit" class="button button-primary">Save Doctor</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
