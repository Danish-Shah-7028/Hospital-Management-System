{% extends "base.html" %}
{% block title %}Edit Appointment{% endblock %}
{% block content %}
<style>
  .edit-wrapper {
    max-width: 600px;
    margin: 32px auto;
    background:#ffffff;
    border-radius:14px;
    box-shadow:0 4px 18px rgba(31,125,180,0.08);
    padding:22px 24px 26px;
    font-family:'Segoe UI','Arial',sans-serif;
    color:#234e36;
  }
  .edit-title {
    font-size:1.3rem;
    font-weight:600;
    color:#186943;
    margin-bottom:12px;
  }
  .form-group { margin-bottom:12px; }
  .form-group label { display:block; margin-bottom:4px; font-size:0.95rem; }
  .form-group input, .form-group select {
    width:100%;
    padding:8px 10px;
    border-radius:8px;
    border:1px solid #cfe7dd;
    font-size:0.95rem;
  }
  .form-actions { margin-top:14px; text-align:right; }
  .btn { padding:8px 14px; border-radius:8px; border:none; font-size:0.92rem; cursor:pointer; }
  .btn-primary { background:#1f6fb2; color:#fff; }
  .btn-secondary { background:#a0aec0; color:#fff; margin-right:6px; }
</style>

<div class="edit-wrapper">
  <div class="edit-title">
    Edit Appointment – {{ appt.user.username if appt.user else 'Patient' }}
  </div>

  <form method="POST" action="{{ url_for('edit_appointment', appt_id=appt.id) }}">
    <div class="form-group">
      <label>Date</label>
      <input type="date" name="date" value="{{ appt.date }}">
    </div>

    <div class="form-group">
      <label>Time</label>
      <input type="time" name="time" value="{{ appt.time }}">
    </div>

    <div class="form-group">
      <label>Status</label>
      <select name="status">
        <option value="Booked" {{ 'selected' if appt.status == 'Booked' else '' }}>Booked</option>
        <option value="Completed" {{ 'selected' if appt.status == 'Completed' else '' }}>Completed</option>
        <option value="Cancelled" {{ 'selected' if appt.status == 'Cancelled' else '' }}>Cancelled</option>
      </select>
    </div>

    <div class="form-actions">
      <a href="{{ url_for('doctor_dashboard') }}" class="btn btn-secondary">Cancel</a>
      <button type="submit" class="btn btn-primary">Save Changes</button>
    </div>
  </form>
</div>
{% endblock %}
