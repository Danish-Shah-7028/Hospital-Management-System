{% extends "base.html" %}
{% block title %}Hospital Management System{% endblock %}
{% block content %}
<style>
    body {
        margin: 0;
        padding: 0;
        font-family: 'Segoe UI', Arial, sans-serif;
        background-image: linear-gradient(rgba(0, 40, 70, 0.45), rgba(0, 40, 70, 0.45)),
                          url('https://imgs.search.brave.com/Q1RrhXOZzJEBioGrSqioAG1HYofyBF6jAENyRmF9GCE/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly90My5m/dGNkbi5uZXQvanBn/LzA2LzI4LzY0LzIy/LzM2MF9GXzYyODY0/MjI2MF9mMU84WXBY/UW9BdTNoSjA1aU55/MFZhSmE1RGFJTElB/My5qcGc');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        height: 100vh;
        overflow: hidden;
    }

    .index-wrapper {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .index-box {
        background: rgba(255, 255, 255, 0.78);
        padding: 36px 42px;
        width: 420px;
        border-radius: 14px;
        backdrop-filter: blur(16px);
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.28);
        text-align: center;
    }

    .index-box h1 {
        margin-bottom: 18px;
        color: #145b7a;
        letter-spacing: 0.5px;
        font-size: 1.9rem;
    }

    .index-box p {
        color: #274056;
        font-size: 0.98rem;
        margin-bottom: 24px;
    }

    .index-box a {
        display: inline-block;
        padding: 11px 26px;
        background-color: #1fa37a;
        color: #ffffff;
        text-decoration: none;
        border-radius: 8px;
        font-size: 0.98rem;
        font-weight: 500;
        transition: background-color 0.2s ease, box-shadow 0.2s ease;
        box-shadow: 0 4px 12px rgba(31, 163, 122, 0.45);
    }

    .index-box a:hover {
        background-color: #168261;
        box-shadow: 0 6px 16px rgba(22, 130, 97, 0.55);
    }
</style>


<div class="index-wrapper">
    <div class="index-box">
        <h1>Welcome to CareWell Hospital</h1>
        <p>Efficient, Reliable, and Patient-Centered Management</p>
        <a class="enter-system" href="{{ url_for('login') }}">Enter System</a>
    </div>
</div>
{% endblock %}
