{% extends "base.html" %}
{% block title %}User Login{% endblock %}
{% block content %}
<style>
    body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(120deg, #1d3557, #457b9d);
        height: 100vh;
        overflow: hidden;
    }

    .login-wrapper {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .login-box {
        background: rgba(255, 255, 255, 0.15);
        padding: 30px 35px;
        width: 350px;
        border-radius: 10px;
        backdrop-filter: blur(6px);
        box-shadow: 0px 0px 10px rgba(0,0,0,0.25);
    }

    .login-box h2 {
        text-align: center;
        margin-bottom: 20px;
        color: #fff;
        letter-spacing: 1px;
    }

    .login-box label {
        color: #e0e0e0;
        font-size: 14px;
    }

    .login-box input {
        width: 100%;
        padding: 10px;
        margin: 6px 0 15px 0;
        border: none;
        border-radius: 5px;
        outline: none;
    }

    .login-box button {
        background-color: #e63946;
        color: white;
        width: 100%;
        padding: 10px;
        border: none;
        margin-top: 10px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 15px;
    }

    .login-box button:hover {
        background-color: #d62828;
    }

    .register-link {
        margin-top: 12px;
        display: block;
        text-align: center;
        font-size: 14px;
        color: #f1faee;
        text-decoration: none;
    }

    .register-link:hover {
        text-decoration: underline;
    }
</style>

{% if error_message %}
{{error_message}}
{% endif %}

<div class="login-wrapper">
    <div class="login-box">
        <h2>Login</h2>
        <form action="{{ url_for('login') }}" method="POST">
            <label for="fullname">Full Name</label>
            <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>

            <button type="submit">Login</button>
            <a class="register-link" href="{{ url_for('registration') }}">New here? Create an account</a>
        </form>
    </div>
</div>
{% endblock %}
