{% extends "base.html" %}
{% block title %}User Registration{% endblock %}
{% block content %}
<style>
    body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(120deg, #1d3557, #457b9d);
        height: 100vh;
        overflow: hidden;
    }

    .reg-wrapper {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .reg-box {
        background: rgba(255, 255, 255, 0.15);
        padding: 30px 35px;
        width: 350px;
        border-radius: 10px;
        backdrop-filter: blur(6px);
        box-shadow: 0px 0px 10px rgba(0,0,0,0.25);
    }

    .reg-box h2 {
        text-align: center;
        margin-bottom: 20px;
        color: #fff;
        letter-spacing: 1px;
    }

    .reg-box label {
        color: #e0e0e0;
        font-size: 14px;
    }

    .reg-box input {
        width: 100%;
        padding: 10px;
        margin: 6px 0 15px 0;
        border: none;
        border-radius: 5px;
        outline: none;
    }

    .reg-box button {
        background-color: #e63946;
        color: white;
        width: 100%;
        padding: 10px;
        border: none;
        margin-top: 10px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 15px;
    }

    .reg-box button:hover {
        background-color: #d62828;
    }

    .login-link {
        margin-top: 12px;
        display: block;
        text-align: center;
        font-size: 14px;
        color: #f1faee;
        text-decoration: none;
    }

    .login-link:hover {
        text-decoration: underline;
    }
</style>

<div class="reg-wrapper">
    <div class="reg-box">
        <h2>Create Account</h2>

        <form method="POST" action="{{ url_for('registration') }}">
            <label for="fullname">Full Name</label>
            <input name = "username" type="text" id="fullname" name="fullname" placeholder="Your full name" required>

            <label for="email">Email ID</label>
            <input name = "email" type="email" id="email" name="email" placeholder="Your email address" required>

            <label for="password">Choose Password</label>
            <input name = "password" type="password" id="password" name="password" placeholder="Create a password" required>

            <button type="submit">Sign Up</button>

            <a class="login-link" href="{{ url_for('login') }}">Already registered? Login here</a>
        </form>
    </div>
</div>
{% endblock %}
